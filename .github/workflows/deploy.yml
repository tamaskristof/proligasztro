name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Posts and comments dated later than the build stay out of it (src/lib/posts.js).
  # Rebuild in the early morning, after Ödön's night (22:00-01:30 Budapest), so last
  # night's post and his replies go live. GitHub's cron is best-effort and often drops
  # top-of-the-hour jobs, so run off the hour, twice (the second is a backup; a rebuild
  # only publishes what is already due): 02:23 and 04:47 UTC = 03:23 and 05:47 CET.
  schedule:
    - cron: '23 2 * * *'
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
